name: NorthSecure Electron Fetch
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/northsecure-electron-fetch.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Electron 44.9.3 Windows x64
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 -o electron-v44.9.3-win32-x64.zip \
            https://github.com/electron/electron/releases/download/v44.9.3/electron-v44.9.3-win32-x64.zip
          echo "41a1ffa0541cb0f2c9b9fe920dd2cef1793ad0ea2ada1a9582958880f4d1b23c  electron-v44.9.3-win32-x64.zip" | sha256sum -c -
      - name: Upload verified Electron runtime
        uses: actions/upload-artifact@v4
        with:
          name: electron-v44.9.3-win32-x64
          path: electron-v44.9.3-win32-x64.zip
          compression-level: 0
          retention-days: 1
