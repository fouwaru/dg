name: NorthSecure Library Bridge Test
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/northsecure-library-bridge-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect harmless ChatGPT Library response
        shell: bash
        run: |
          set -u
          URL='https://chatgpt.com/api/library/files/libfile_a1f8704dbdb48191883aea55d767eefb/download'
          code="$(curl -L -sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0.0.0 Safari/537.36' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -o report.bin -w '%{http_code}' "$URL")"
          echo "HTTP=$code SIZE=$(wc -c < report.bin)"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('report.bin').read_text('utf-8','replace')
          print(s[:3500])
          PY
