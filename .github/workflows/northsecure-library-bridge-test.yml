name: NorthSecure Library Bridge Test
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/northsecure-library-bridge-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test ChatGPT Library download bridge
        shell: bash
        run: |
          set -u
          URL='https://chatgpt.com/api/library/files/libfile_a1f8704dbdb48191883aea55d767eefb/download'
          code="$(curl -L -sS             -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0.0.0 Safari/537.36'             -H 'Accept: application/octet-stream,application/zip,*/*'             -H 'Accept-Language: en-US,en;q=0.9'             -H 'Referer: https://chatgpt.com/'             -o report.bin -w '%{http_code}' "$URL")"
          echo "HTTP=$code"
          echo "SIZE=$(wc -c < report.bin)"
          file report.bin || true
          grep -o -m1 '<title>[^<]*</title>' report.bin || true
          grep -o -m1 -E 'Just a moment|Access denied|Unauthorized|Forbidden|Cloudflare|cf-ray|Please enable' report.bin || true
          test "$code" = "200"
