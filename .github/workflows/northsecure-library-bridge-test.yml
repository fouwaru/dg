name: NorthSecure Library Bridge Test
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/northsecure-library-bridge-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test harmless Library URL through Chromium
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://chatgpt.com/api/library/files/libfile_a1f8704dbdb48191883aea55d767eefb/download'
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$URL" > dom.html 2>chrome.err || true
          echo "DOM_SIZE=$(wc -c < dom.html)"
          grep -o -m1 '<title>[^<]*</title>' dom.html || true
          grep -i -m3 -E 'login|sign in|access denied|forbidden|challenge|cloudflare|download|library' dom.html || true
          tail -50 chrome.err || true
